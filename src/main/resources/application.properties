spring.application.name=receipts

# On-disk SQLite database (a real DB file, not in-memory)
# busy_timeout makes a writer wait (ms) for the lock instead of failing (SQLite serializes writers)
spring.datasource.url=jdbc:sqlite:data/receipts.db?busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# JSON uses snake_case to match the fixture/gold shape (receipt_id, grand_total, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Local file storage for uploaded receipts
storage.dir=data/files

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
